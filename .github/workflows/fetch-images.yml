# One-time helper: downloads the images the saved copy of the old site was missing.
# Uses plain http:// because the live site's HTTPS certificate has expired.
name: Fetch missing images
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          base="http://mememediterranean.com/images"
          # "saved-as-name  source-file(s), best first"
          while read -r dest sources; do
            for src in $sources; do
              if curl -sfL "$base/$src" -o "images/$dest" && file "images/$dest" | grep -qiE 'image|icon'; then
                echo "got $dest <- $src"; break
              fi
              rm -f "images/$dest"
            done
            [ -f "images/$dest" ] || echo "MISSING $dest"
          done <<'LIST'
          hk_aboutuspara.jpg hk_aboutuspara.jpg
          food2para.jpg food2para.jpg
          hk_reservationspara.jpg hk_reservationspara.jpg
          hk_ourcuisinepara.jpg hk_ourcuisinepara.jpg
          hk_partypara.jpg hk_partypara.jpg
          au8i4814.jpg au8i4814.jpg
          hkordermenu2.jpg hkordermenu2.jpg
          hk_contactpara.jpg hk_contactpara.jpg
          hklunchmenu.jpg hklunchmenu.jpg
          hkdinnermenu.jpg hkdinnermenu.jpg
          hkbrunchmenu2.jpg hkbrunchmenu2.jpg
          hkordermenu.jpg hkordermenu.jpg
          out.jpg out.jpg
          lunch.jpg lunch.jpg
          runchmenu.jpg runchmenu.jpg
          07.jpg 07.jpg
          08hk.jpg 08hk.jpg
          brunch2.jpg brunch2.jpg
          giftcard-meme.png giftcard-meme-u22736_2x.png giftcard-meme-u22736.png
          dinnerdelivery.png dinnerdelivery-u72818_2x.png dinnerdelivery-u72818.png
          rollbluem.png rollbluem-u281-fr_2x.png rollbluem-u281-fr.png
          rollwhitem.png rollwhitem_2x.png rollwhitem.png
          map.png map-u320_2x.png map-u320.png
          mobile.png mobile-u321_2x.png mobile-u321.png
          envelope.png enveope-u322_2x.png enveope-u322.png
          favicon.ico favicon.ico
          LIST
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          git diff --cached --quiet && echo "Nothing downloaded" || git commit -m "Add images downloaded from the live site"
          git push
